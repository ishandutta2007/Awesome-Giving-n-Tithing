<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1538" />
    </linearGradient>

    <!-- Animated Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#f59e0b;#8b5cf6;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#6366f1;#8b5cf6;#ec4899;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: url(#primaryGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-pill {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .pulse-heart {
      transform-origin: 75px 75px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    .shimmer-coin {
      animation: coinFloat 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes coinFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#64748b" stroke-width="0.75" />
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" stroke="#64748b" stroke-width="0.75" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="90" r="130" fill="#6366f1" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="1060" cy="270" r="140" fill="#ec4899" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="980" cy="80" r="90" fill="#3b82f6" opacity="0.12" filter="url(#softGlow)" />

  <!-- Decorative Icon Graphic: Giving Heart -->
  <g transform="translate(90, 105)">
    <g class="pulse-heart">
      <circle cx="75" cy="75" r="68" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.9" />
      <path d="M75 110 C50 85, 35 68, 35 50 C35 34, 47 24, 61 24 C68 24, 73 28, 75 32 C77 28, 82 24, 89 24 C103 24, 115 34, 115 50 C115 68, 100 85, 75 110 Z" fill="url(#primaryGrad)" />
      <circle cx="75" cy="55" r="6" fill="#ffffff" opacity="0.8" />
    </g>
  </g>

  <!-- Stewardship & Coins Dynamic Elements -->
  <g transform="translate(950, 120)" class="shimmer-coin">
    <g transform="translate(0, 0)">
      <circle cx="45" cy="45" r="42" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2" filter="url(#glow)" opacity="0.9" />
      <text x="45" y="56" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#78350f" text-anchor="middle">✝</text>
    </g>
    <g transform="translate(55, 40)">
      <circle cx="35" cy="35" r="32" fill="url(#goldGrad)" stroke="#fde047" stroke-width="1.8" opacity="0.95" />
      <text x="35" y="44" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#78350f" text-anchor="middle">♥</text>
    </g>
  </g>

  <!-- Central Content Text -->
  <g transform="translate(270, 115)">
    <text x="0" y="40" class="title">Awesome Giving &amp; Tithing</text>
    <text x="0" y="82" class="subtitle">Curated SaaS Platforms, Open-Source Solutions &amp; Stewardship Tools</text>

    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="17" r="5" fill="#10b981" />
      <text x="30" y="22" class="badge-pill">⛪ Church Giving</text>

      <rect x="155" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="171" cy="17" r="5" fill="#3b82f6" />
      <text x="185" y="22" class="badge-pill">💳 Online Donations</text>

      <rect x="330" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="346" cy="17" r="5" fill="#a855f7" />
      <text x="360" y="22" class="badge-pill">📱 Text-to-Give</text>

      <rect x="485" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="501" cy="17" r="5" fill="#ec4899" />
      <text x="515" y="22" class="badge-pill">🔓 Open Source</text>
    </g>
  </g>
</svg>